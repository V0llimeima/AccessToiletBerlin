gradle.projectsEvaluated {
    def app = gradle.rootProject.project(':app')
    def appCompile = app.tasks.named('compileDebugJavaWithJavac').get()
    def output = app.layout.buildDirectory.dir('phase6-checks')
    def checkClasspath = app.files({ appCompile.classpath }, { appCompile.destinationDirectory.get().asFile }, { app.android.bootClasspath })
    def compileChecks = app.tasks.register('compilePhase6Checks', JavaCompile) {
        dependsOn appCompile
        source gradle.rootProject.file('verification/RoutingCheck.java')
        classpath = checkClasspath
        destinationDirectory = output
        sourceCompatibility = '17'; targetCompatibility = '17'; options.encoding = 'UTF-8'
    }
    app.tasks.register('checkPhase6Routing', JavaExec) {
        dependsOn compileChecks; classpath = app.files(checkClasspath, output)
        mainClass = 'de.bht.accesstoilet.RoutingCheck'
        args app.file('src/main/res/values/strings.xml').absolutePath
    }
}
